name: CI
# Public CI on GitHub-hosted runners (free for public repos). Runs on pushes to main and to ci/** (the private
# repo mirrors each pull request to ci/pr-<n>), nightly, and on demand. Everything here is fictional data.
on:
  push:
    branches: ['main', 'ci/**']
  schedule:
    - cron: '47 20 * * *'   # nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: persons guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Only the generated demo seed may exist (no other persons*.json)
        run: |
          n=$(find . -path ./.git -prune -o -name 'persons*.json' -print | grep -vxF './server/seed/demo-persons.json' | wc -l)
          if [ "$n" -ne 0 ]; then echo "::error::$n unexpected persons*.json file(s)"; exit 1; fi
          echo "persons check: clean"

  syntax:
    name: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: 'server/package.json' }
      - name: Syntax check
        run: |
          node --check server/server.js
          for f in web/js/*.js; do node --input-type=module --check < "$f"; done
          node --check web/sw.js
          bash -n scripts/ci-db.sh

  unit:
    name: unit + DB (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giapha_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: postgres://postgres:postgres@127.0.0.1:5432/giapha_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: 'server/package.json', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - name: Schema and demo family (twice each, as the private CI does)
        working-directory: server
        env: { DATABASE_URL: '${{ env.DB_URL }}', GP_DEMO_SEED: '1' }
        run: node scripts/migrate.js && node scripts/migrate.js && node scripts/seed.js && node scripts/seed.js
      - name: Unit + DB tests, shard ${{ matrix.shard }}/3
        working-directory: server
        env: { GP_TEST_DATABASE_URL: '${{ env.DB_URL }}' }
        run: node --test --test-concurrency=1 --test-timeout=120000 --test-force-exit --test-shard=${{ matrix.shard }}/3 test/*.test.js

  e2e:
    name: e2e (shard ${{ matrix.shard }} of 4, Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giapha_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: postgres://postgres:postgres@127.0.0.1:5432/giapha_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: 'server/package.json', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - name: Playwright library and browsers (Chromium + WebKit, with OS deps)
        run: |
          npm i --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium webkit
          CHROME="$(NODE_PATH="$RUNNER_TEMP/pw/node_modules" node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "GP_E2E_CHROME=$CHROME" >> "$GITHUB_ENV"
      - name: Schema and demo family
        working-directory: server
        env: { DATABASE_URL: '${{ env.DB_URL }}', GP_DEMO_SEED: '1' }
        run: node scripts/migrate.js && node scripts/seed.js
      - name: E2E shard ${{ matrix.shard }} of 4 (every file, split by size)
        env:
          SHARD: ${{ matrix.shard }}
          GP_TEST_DATABASE_URL: ${{ env.DB_URL }}
        run: |
          FILES="$(ls test/e2e/*.test.js)"
          MINE="$(node scripts/e2e-shards.mjs 4 $FILES | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[Number(process.env.SHARD)]))')"
          if [ -z "$MINE" ]; then echo "nothing for this shard"; exit 0; fi
          LIST=(); for f in $MINE; do LIST+=("../$f"); done
          printf '%s\n' "${LIST[@]}"
          cd server && NODE_PATH="$RUNNER_TEMP/pw/node_modules" node --test --test-concurrency=1 --test-timeout=120000 --test-force-exit "${LIST[@]}"
