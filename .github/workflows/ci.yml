name: CI
# Public genealogia CI: GitHub-hosted runners only (free on public repos). Never a self-hosted runner here.
# Runs on pull requests (affected e2e only) and on sync/** branches pushed by the private mirror (full e2e).
on:
  pull_request:
  push:
    branches: ['sync/**']
  schedule:
    - cron: '47 20 * * *'   # nightly: full e2e suite
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full e2e suite (default: only the tests the change affects)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  leak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Only the generated demo seed may exist (no other persons*.json)
        run: |
          n=$(find . -path ./.git -prune -o -name 'persons*.json' -print | grep -vxF './server/seed/demo-persons.json' | wc -l)
          if [ "$n" -ne 0 ]; then echo "::error::$n unexpected persons*.json file(s)"; exit 1; fi
          echo "persons check: clean"

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax check
        run: |
          node --check server/server.js
          for f in web/js/*.js; do node --input-type=module --check < "$f"; done
          node --check web/sw.js
          bash -n scripts/ci-db.sh
      - name: Dead-code scan (warning only)
        run: node scripts/deadcode.mjs || echo "::warning::deadcode scan reported findings"

  unit:
    name: unit + DB (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - name: Generate fictional demo seed
        run: mkdir -p server/seed && node scripts/make-demo-seed.mjs
      - name: Throwaway Postgres 16
        run: bash scripts/ci-db.sh start
      - name: Unit + DB tests, shard ${{ matrix.shard }}/3 (node --test --test-shard, Node 22)
        working-directory: server
        run: node --test --test-concurrency=1 --test-timeout=120000 --test-force-exit --test-shard=${{ matrix.shard }}/3 test/*.test.js
      - if: always()
        run: bash scripts/ci-db.sh stop

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.pick.outputs.files }}
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: pick
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          FULL: ${{ github.event_name != 'pull_request' || inputs.full == true }}
        run: |
          if [ "$FULL" = "true" ]; then
            LIST="$(ls test/e2e/*.test.js)"
          else
            git fetch --no-tags --depth=50 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            LIST="$(node scripts/affected-tests.mjs --base "origin/$BASE_REF" | sed 's#^\.\./#./#; s#^\./##')"
          fi
          echo "E2E files:"; echo "${LIST:-  (none)}"
          FILES="$(printf '%s\n' $LIST | sed '/^$/d' | tr '\n' ' ')"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "shards=$(node scripts/e2e-shards.mjs 4 $FILES)" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (shard ${{ matrix.shard }} of 4)
    needs: plan
    if: needs.plan.outputs.files != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - name: Playwright (library only; Chrome from the runner image)
        run: npm i --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.63.0
      - name: Generate fictional demo seed
        run: mkdir -p server/seed && node scripts/make-demo-seed.mjs
      - name: Throwaway Postgres 16
        run: bash scripts/ci-db.sh start
      - name: E2E shard ${{ matrix.shard }} of 4
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
          SHARD: ${{ matrix.shard }}
          GP_E2E_CHROME: /usr/bin/google-chrome
        run: |
          MINE="$(node -e 'console.log(JSON.parse(process.env.SHARDS)[Number(process.env.SHARD)])')"
          if [ -z "$MINE" ]; then echo "nothing for this shard"; exit 0; fi
          LIST=(); for f in $MINE; do LIST+=("../$f"); done   # paths relative to server/
          printf '%s\n' "${LIST[@]}"
          cd server && NODE_PATH="$RUNNER_TEMP/pw/node_modules" node --test --test-concurrency=1 --test-timeout=120000 --test-force-exit "${LIST[@]}"
      - if: always()
        run: bash scripts/ci-db.sh stop
